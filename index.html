<style>
:root{--bg1:#fffaf5;--bg2:#ffe9dd;--bg3:#fff3e8;--card:#fffdf9;--text:#2f2925;--muted:#a0958c;--line:#eadfd7;--accent:#f49a70;--accent2:#ffd6c2;--shadow:0 10px 30px rgba(121,76,51,.06)}

body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","PingFang SC","Noto Sans SC","Roboto",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
.app{max-width:760px;margin:auto;padding-bottom:96px}
.header{padding:calc(env(safe-area-inset-top) + 18px) 18px 14px;position:sticky;top:0;z-index:20;background:rgba(255,249,244,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(234,223,215,.72)}

.roles{display:flex;gap:8px;margin-top:14px}

main{padding:16px} .panel{display:none} .panel.active{display:block}

.text-btn{border:0;background:transparent;color:#b96e4d;font-weight:700;padding:4px 0}

.empty{font-size:13px;color:var(--muted);padding:10px 0}

.nav-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}

.library-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:11px} .library-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap} .library-tabs button.active{background:#ffe0d0;color:#9b5737}

input,select{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px;color:var(--text)} label.field{display:block;margin-top:11px} label.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.primary,.secondary{width:100%;border:0;border-radius:16px;padding:13px 14px;font-weight:800;margin-top:10px} .primary{background:linear-gradient(135deg,#ef9369,#f7b28d);color:#fff} .secondary{background:#f3eae4;color:#5d5149}
.input-row{display:flex;gap:8px} .input-row input{flex:1} .chip{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;margin:6px 6px 0 0;font-size:12px}

.food-info{

  justify-content:center;
}
.food-name{
  line-height:1.25;

}
.compact{
  width:100%;

}

  width:100%;
  height:100%;
  min-height:96px;
  aspect-ratio:auto;
  object-fit:cover;

.row-grid{
  grid-template-columns:1fr;

.logout-btn{

  font-weight:800;

<body>
<div id="loading" class="loading">正在连接家庭菜单…</div>

<main>

</div>

   .eq("user_id",state.user.id).limit(1);

 if(data && data.length){
   state.member={household_id:data[0].household_id,role:data[0].role};
   state.household=data[0].households;
   return true;
 }
 return false;
}
async function seedDishesIfEmpty(){
 const {count,error}=await sb.from("dishes").select("*",{count:"exact",head:true}).eq("household_id",state.household.id);
 if(error) throw error;
 if(count>0)return;
 const rows=defaultDishes.map(x=>({
   household_id:state.household.id,name_zh:x[0],name_en:x[1],category:x[2],
   image_url:demoImages[x[3]],is_quick:true,is_active:true,created_by:state.user.id
 }));
 const {error:e}=await sb.from("dishes").insert(rows);
 if(e) throw e;
}
async function signedDishImages(rows){
 return await Promise.all(rows.map(async d=>{
   d._src=d.image_url||"";
   if(d.image_path){
     const {data}=await sb.storage.from("dish-photos").createSignedUrl(d.image_path,3600);
     if(data?.signedUrl)d._src=data.signedUrl;
   }
   return d;
 }));
}
async function loadAll(){
 const [histStart,histEnd]=dateRangeForHistory();
 const [dishesRes,itemsRes,setRes]=await Promise.all([
   sb.from("dishes").select("*").eq("household_id",state.household.id).order("created_at"),
   sb.from("meal_items").select("*").eq("household_id",state.household.id).gte("meal_date",histStart).lte("meal_date",histEnd).order("created_at"),
   sb.from("household_settings").select("*").eq("household_id",state.household.id).single()
 ]);
 if(dishesRes.error)throw dishesRes.error;if(itemsRes.error)throw itemsRes.error;if(setRes.error)throw setRes.error;
 state.dishes=await signedDishImages(dishesRes.data||[]);
 state.items=itemsRes.data||[]; state.settings=setRes.data;
 renderAll();
}
function subscribeRealtime(){
 if(channel)sb.removeChannel(channel);
 channel=sb.channel("family-"+state.household.id)
 .on("postgres_changes",{event:"*",schema:"public",table:"dishes",filter:`household_id=eq.${state.household.id}`},loadAll)
 .on("postgres_changes",{event:"*",schema:"public",table:"meal_items",filter:`household_id=eq.${state.household.id}`},loadAll)
 .on("postgres_changes",{event:"*",schema:"public",table:"household_settings",filter:`household_id=eq.${state.household.id}`},loadAll)
 .subscribe();
}
function getDish(id){return state.dishes.find(d=>d.id===id)}
function itemsFor(date,meal,category){return state.items.filter(x=>x.meal_date===date&&x.meal_type===meal&&x.category===category)}
function weeklyCount(dishId,category){
 const [a,b]=weekRange();return state.items.filter(x=>x.dish_id===dishId&&x.category===category&&x.meal_date>=a&&x.meal_date<=b).length;
}
function roleMeta(item,cat){
 const e=emoji[item.picked_by_role]||"";
 if(["meat","veg"].includes(cat)) return `${e} · ${state.lang==="zh"?"本周第":"#"}${weeklyCount(item.dish_id,cat)}${state.lang==="zh"?"次":" this week"}`;
 return e;
}
function foodCard(item,cat,compact=false){
 const d=getDish(item.dish_id); if(!d)return "";
 return `<div class="food-card ${compact?"compact":""}"><img src="${d._src||d.image_url||""}" alt=""><div class="food-info"><div class="food-name">${dishName(d)}</div><div class="food-meta">${roleMeta(item,cat)}</div></div></div>`;
}
function renderHeader(){
 document.getElementById("appTitle").textContent=state.lang==="zh"?"我们家的菜单":"Family Menu";
 document.getElementById("todayDate").textContent=(state.lang==="zh"?"今天 · ":"Today · ")+today.toLocaleDateString(state.lang==="zh"?"zh-CN":"en-SG",{weekday:"long",month:"long",day:"numeric"});
 document.getElementById("langBtn").textContent=state.lang==="zh"?"EN":"中";document.getElementById("settingsLangBtn").textContent=state.lang==="zh"?"EN":"中";
 document.getElementById("currentRoleBtn").textContent=`${emoji[state.member.role]} ${roleNames[state.lang][state.member.role]}`;
 document.getElementById("currentRoleBtn").classList.add("active");
}
function renderToday(){
 const schedule=state.settings.cook_days; const idx=(today.getDay()===0?6:today.getDay()-1); const day=schedule[idx];
 const b=itemsFor(todayKey,"breakfast","breakfast"); document.getElementById("breakfastCards").innerHTML=!day.breakfast?`<div class="empty">${t("rest")}</div>`:(b.length?b.map(x=>foodCard(x,"breakfast")).join(""):`<div class="empty">${t("none")}</div>`);
 for(const cat of ["meat","veg","soup","staple"]){
   const arr=itemsFor(todayKey,"dinner",cat);
   document.getElementById(cat+"Row").innerHTML=!day.dinner?`<div class="empty">${t("rest")}</div>`:(arr.length?arr.map(x=>foodCard(x,cat,true)).join(""):`<div class="empty">${t("none")}</div>`);
 }
 const ta=itemsFor(todayKey,"dinner","takeaway"),wrap=document.getElementById("takeawayWrap");
 wrap.style.display=ta.length?"block":"none";
 document.getElementById("takeawayRow").innerHTML=ta.map(x=>`<div class="food-card compact"><div class="food-info"><div class="food-name">🥡 ${x.custom_name}</div><div class="food-meta">${emoji[x.picked_by_role]||""}</div></div></div>`).join("");
 document.querySelectorAll(".editMeal").forEach(b=>b.style.display=canEdit()?"block":"none");
}
function renderI18n(){
 document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
 document.getElementById("breakfastHeading").textContent=`☀️ ${state.lang==="zh"?"今天早餐":"Today's Breakfast"}`;
 document.getElementById("dinnerHeading").textContent=`🌙 ${state.lang==="zh"?"今天晚餐":"Today's Dinner"}`;
 document.querySelectorAll(".editMeal").forEach(b=>b.textContent=t("choose"));
 document.getElementById("libraryHeading").textContent=t("library");document.getElementById("historyHeading").textContent=t("history");document.getElementById("settingsHeading").textContent=t("settings");document.getElementById("languageLabel").textContent=t("language");document.getElementById("historyNote").textContent=t("historyNote");
 document.querySelectorAll(".closeModal").forEach(b=>b.textContent=t("cancel"));
}
function renderLibrary(){
 const cats=["breakfast","meat","veg","soup","staple"],tabs=document.getElementById("libraryTabs");tabs.innerHTML="";
 cats.forEach(c=>{const btn=document.createElement("button");btn.textContent=t(c);btn.className=state.libraryCat===c?"active":"";btn.onclick=()=>{state.libraryCat=c;renderLibrary()};tabs.appendChild(btn)});
 if(canEdit()){
   const hb=document.createElement("button");
   hb.textContent=state.showHidden?(state.lang==="zh"?"隐藏停用菜":"Hide inactive"):(state.lang==="zh"?"显示停用菜":"Show inactive");
   hb.onclick=()=>{state.showHidden=!state.showHidden;renderLibrary()};
   tabs.appendChild(hb);
 }
 const g=document.getElementById("libraryGrid");g.innerHTML="";
 state.dishes.filter(d=>d.category===state.libraryCat && (state.showHidden || d.is_active!==false)).forEach(d=>{
   const el=document.createElement("div");el.className="library-card"+(d.is_active===false?" hidden-dish":"");
   el.innerHTML=`<img src="${d._src||d.image_url||""}"><div class="body"><strong>${dishName(d)}</strong>${d.is_quick?`<div class="badge">${state.lang==="zh"?"快捷备用":"Quick"}</div>`:""}${d.is_active===false?`<div class="badge">${state.lang==="zh"?"已停用":"Inactive"}</div>`:""}${canEdit()?`<button class="edit-card-btn" onclick="openEditDish('${d.id}')">${state.lang==="zh"?"编辑":"Edit"}</button>`:""}</div>`;
   g.appendChild(el)
 });
 document.getElementById("addDishFab").style.display=canEdit()?"block":"none";
}
function renderHistory(){
 const list=document.getElementById("historyList");list.innerHTML="";
 const byDate={};state.items.forEach(x=>(byDate[x.meal_date]??=[]).push(x));
 Object.keys(byDate).sort().reverse().forEach(k=>{const d=new Date(k+"T00:00:00"),rows=byDate[k];
   const names=(meal)=>rows.filter(x=>x.meal_type===meal).map(x=>x.category==="takeaway"?x.custom_name:dishName(getDish(x.dish_id))).join("、");
   const el=document.createElement("div");el.className="history-card";el.innerHTML=`<div class="history-date">${d.toLocaleDateString(state.lang==="zh"?"zh-CN":"en-SG",{year:"numeric",month:"short",day:"numeric",weekday:"short"})}</div><div class="history-line">${t("breakfast")}: ${names("breakfast")||"—"}</div><div class="history-line">${t("dinner")}: ${names("dinner")||"—"}</div>`;list.appendChild(el);
 });
 if(!Object.keys(byDate).length)list.innerHTML=`<div class="empty">${t("none")}</div>`;
}
function renderSettings(){
 document.getElementById("logoutBtn").textContent=state.lang==="zh"?"退出登录":"Log out";
 document.getElementById("familyInfoName").textContent=state.household.name;
 document.getElementById("familyInfoRole").textContent=`${emoji[state.member.role]} ${roleNames[state.lang][state.member.role]}`;
 const box=document.getElementById("cookDaySettings");box.innerHTML="";
 const monday=new Date(today);const dw=monday.getDay();monday.setDate(monday.getDate()+(dw===0?-6:1-dw));
 state.settings.cook_days.forEach((s,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);const row=document.createElement("div");row.className="setting-row";row.innerHTML=`<div><strong>${d.toLocaleDateString(state.lang==="zh"?"zh-CN":"en-SG",{weekday:"long"})}</strong><div class="subtle">${d.toLocaleDateString(state.lang==="zh"?"zh-CN":"en-SG",{month:"short",day:"numeric"})}</div></div><div style="display:flex;gap:10px"><label>${t("breakfast")} <input type="checkbox" data-i="${i}" data-m="breakfast" ${s.breakfast?"checked":""} ${canEdit()?"":"disabled"}></label><label>${t("dinner")} <input type="checkbox" data-i="${i}" data-m="dinner" ${s.dinner?"checked":""} ${canEdit()?"":"disabled"}></label></div>`;box.appendChild(row)});
 box.querySelectorAll("input").forEach(inp=>inp.onchange=async e=>{const days=JSON.parse(JSON.stringify(state.settings.cook_days));days[+e.target.dataset.i][e.target.dataset.m]=e.target.checked;const {error}=await sb.from("household_settings").update({cook_days:days,updated_at:new Date().toISOString()}).eq("household_id",state.household.id);if(error)alert(error.message)});
}
function renderAll(){renderHeader();renderI18n();renderToday();renderLibrary();renderHistory();renderSettings()}

function openPicker(type){
 pickerType=type;
 if(type==="breakfast") tempSelection=itemsFor(todayKey,"breakfast","breakfast").map(x=>({dish_id:x.dish_id,picked_by_role:x.picked_by_role}));
 else {
   tempSelection={};["meat","veg","soup","staple","takeaway"].forEach(c=>tempSelection[c]=itemsFor(todayKey,"dinner",c).map(x=>({dish_id:x.dish_id,custom_name:x.custom_name,picked_by_role:x.picked_by_role})));
 }
 document.getElementById("pickerTitle").textContent=type==="breakfast"?(state.lang==="zh"?"选择早餐":"Choose Breakfast"):(state.lang==="zh"?"选择晚餐":"Choose Dinner");
 document.getElementById("pickerSub").textContent=document.getElementById("todayDate").textContent;renderPickerBody();document.getElementById("savePickerBtn").textContent=t("save");document.getElementById("pickerModal").classList.add("show");
}
function selectionArray(cat){return pickerType==="breakfast"?tempSelection:tempSelection[cat]}
function selected(cat,id){return selectionArray(cat).some(x=>x.dish_id===id)}
function togglePick(cat,id){const arr=selectionArray(cat),ix=arr.findIndex(x=>x.dish_id===id);if(ix>=0)arr.splice(ix,1);else arr.push({dish_id:id,picked_by_role:state.member.role});renderPickerBody()}
function renderPickerBody(){
 const body=document.getElementById("pickerBody");body.innerHTML="";const sections=pickerType==="breakfast"?["breakfast"]:["meat","veg","soup","staple"];
 sections.forEach(cat=>{const sec=document.createElement("div");sec.className="pick-section";sec.innerHTML=`<h4>${t(cat)}</h4><div class="pick-grid"></div>`;const grid=sec.querySelector(".pick-grid");state.dishes.filter(d=>d.category===cat&&d.is_quick&&d.is_active!==false).forEach(d=>{const btn=document.createElement("button");btn.className="pick-card"+(selected(cat,d.id)?" selected":"");btn.innerHTML=`<span class="check">✓</span><img src="${d._src||d.image_url||""}"><div class="body"><strong>${dishName(d)}</strong><div class="food-meta">${["meat","veg"].includes(cat)?`${state.lang==="zh"?"本周第":"#"}${weeklyCount(d.id,cat)}${state.lang==="zh"?"次":" this week"}`:""}</div></div>`;btn.onclick=()=>togglePick(cat,d.id);grid.appendChild(btn)});body.appendChild(sec)});
 if(pickerType==="dinner"){const sec=document.createElement("div");sec.className="pick-section";sec.innerHTML=`<h4>🥡 ${t("takeaway")}</h4><div class="input-row"><input id="takeawayInput" placeholder="${t("takeawayPH")}"><button class="mini" id="addTakeawayBtn">${t("addTakeaway")}</button></div><div id="takeawayChips"></div>`;body.appendChild(sec);const refresh=()=>{sec.querySelector("#takeawayChips").innerHTML=tempSelection.takeaway.map((x,i)=>`<span class="chip">${x.custom_name} ${emoji[x.picked_by_role]||""} <button onclick="removeTakeaway(${i})" style="border:0;background:none">×</button></span>`).join("")};sec.querySelector("#addTakeawayBtn").onclick=()=>{const v=sec.querySelector("#takeawayInput").value.trim();if(v){tempSelection.takeaway.push({custom_name:v,picked_by_role:state.member.role});renderPickerBody()}};refresh()}
}
window.removeTakeaway=i=>{tempSelection.takeaway.splice(i,1);renderPickerBody()};

async function savePicker(){
 const meal=pickerType; const role=state.member.role;
 const {error:delErr}=await sb.from("meal_items").delete().eq("household_id",state.household.id).eq("meal_date",todayKey).eq("meal_type",meal);
 if(delErr){alert(delErr.message);return}
 let rows=[];
 if(meal==="breakfast") rows=tempSelection.map(x=>({household_id:state.household.id,meal_date:todayKey,meal_type:"breakfast",category:"breakfast",dish_id:x.dish_id,picked_by_user_id:state.user.id,picked_by_role:x.picked_by_role||role}));
 else {
  for(const cat of ["meat","veg","soup","staple"]) rows.push(...tempSelection[cat].map(x=>({household_id:state.household.id,meal_date:todayKey,meal_type:"dinner",category:cat,dish_id:x.dish_id,picked_by_user_id:state.user.id,picked_by_role:x.picked_by_role||role})));
  rows.push(...tempSelection.takeaway.map(x=>({household_id:state.household.id,meal_date:todayKey,meal_type:"dinner",category:"takeaway",custom_name:x.custom_name,picked_by_user_id:state.user.id,picked_by_role:x.picked_by_role||role})));
 }
 if(rows.length){const {error}=await sb.from("meal_items").insert(rows);if(error){alert(error.message);return}}
 document.getElementById("pickerModal").classList.remove("show");await loadAll();
}

let editingDishId=null;

window.openEditDish=function(id){
 const d=getDish(id); if(!d || !canEdit())return;
 editingDishId=id;
 document.getElementById("editDishHeading").textContent=state.lang==="zh"?"编辑菜品":"Edit dish";
 document.getElementById("editDishNameLabel").textContent=t("dishName");
 document.getElementById("editDishCategoryLabel").textContent=t("category");
 document.getElementById("editDishPhotoLabel").textContent=state.lang==="zh"?"更换照片":"Replace photo";
 document.getElementById("editDishNoteLabel").textContent=t("note");
 document.getElementById("editQuickLabel").textContent=t("quick");
 document.getElementById("saveDishEditBtn").textContent=state.lang==="zh"?"保存修改":"Save changes";
 document.getElementById("hideDishBtn").textContent=d.is_active===false?(state.lang==="zh"?"恢复菜品":"Restore dish"):(state.lang==="zh"?"隐藏菜品":"Hide dish");
 document.getElementById("editDishName").value=d.name_zh||"";
 document.getElementById("editDishNote").value=d.note||"";
 document.getElementById("editDishQuick").checked=!!d.is_quick;
 const sel=document.getElementById("editDishCategory");sel.innerHTML="";
 ["breakfast","meat","veg","soup","staple"].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=t(c);if(c===d.category)o.selected=true;sel.appendChild(o)});
 document.getElementById("editDishPhoto").value="";
 document.getElementById("editDishModal").classList.add("show");
};

async function saveDishEdit(){
 const d=getDish(editingDishId); if(!d)return;
 const nm=document.getElementById("editDishName").value.trim()||d.name_zh;
 const updates={name_zh:nm,name_en:nm,category:document.getElementById("editDishCategory").value,note:document.getElementById("editDishNote").value.trim(),is_quick:document.getElementById("editDishQuick").checked,updated_at:new Date().toISOString()};
 const file=document.getElementById("editDishPhoto").files[0];
 if(file){
   const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
   const image_path=`${state.household.id}/${Date.now()}.${ext}`;
   const {error:upErr}=await sb.storage.from("dish-photos").upload(image_path,file,{upsert:false});
   if(upErr){alert(upErr.message);return}
   updates.image_path=image_path; updates.image_url=null;
 }
 const {error}=await sb.from("dishes").update(updates).eq("id",editingDishId).eq("household_id",state.household.id);
 if(error){alert(error.message);return}
 document.getElementById("editDishModal").classList.remove("show");
 await loadAll();
}

async function toggleDishActive(){
 const d=getDish(editingDishId); if(!d)return;
 const next=d.is_active===false;
 const {error}=await sb.from("dishes").update({is_active:next,updated_at:new Date().toISOString()}).eq("id",editingDishId).eq("household_id",state.household.id);
 if(error){alert(error.message);return}
 document.getElementById("editDishModal").classList.remove("show");
 await loadAll();
}

async function uploadDish(){
 const name=document.getElementById("newDishName").value.trim();if(!name)return;
 const cat=document.getElementById("newDishCategory").value,file=document.getElementById("newDishPhoto").files[0];let image_path=null;
 if(file){const ext=(file.name.split(".").pop()||"jpg").toLowerCase();image_path=`${state.household.id}/${Date.now()}.${ext}`;const {error}=await sb.storage.from("dish-photos").upload(image_path,file,{upsert:false});if(error){alert(error.message);return}}
 const {error}=await sb.from("dishes").insert({household_id:state.household.id,name_zh:name,name_en:name,category:cat,image_path,note:document.getElementById("newDishNote").value.trim(),is_quick:document.getElementById("newDishQuick").checked,is_active:true,created_by:state.user.id});
 if(error){alert(error.message);return}
 document.getElementById("addDishModal").classList.remove("show");await loadAll();
}

document.getElementById("tabCreate").onclick=()=>{document.getElementById("createBox").style.display="block";document.getElementById("joinBox").style.display="none";document.getElementById("tabCreate").classList.add("active");document.getElementById("tabJoin").classList.remove("active")};
document.getElementById("tabJoin").onclick=()=>{document.getElementById("createBox").style.display="none";document.getElementById("joinBox").style.display="block";document.getElementById("tabJoin").classList.add("active");document.getElementById("tabCreate").classList.remove("active")};
document.getElementById("createFamilyBtn").onclick=async()=>{try{document.getElementById("onboardError").textContent="";const name=document.getElementById("familyName").value.trim(),code=document.getElementById("createCode").value.trim();const {data,error}=await sb.rpc("create_household",{p_name:name,p_join_code:code,p_role:"me"});if(error)throw error;await bootAfterMembership()}catch(e){document.getElementById("onboardError").textContent=e.message}};
document.getElementById("joinFamilyBtn").onclick=async()=>{try{document.getElementById("onboardError").textContent="";const code=document.getElementById("joinCode").value.trim(),role=document.getElementById("joinRole").value;const {data,error}=await sb.rpc("join_household",{p_join_code:code,p_role:role});if(error)throw error;await bootAfterMembership()}catch(e){document.getElementById("onboardError").textContent=e.message}};


async function logout(){
 const msg=state.lang==="zh"
   ?"退出后，这台设备需要用家庭邀请码重新加入。确定退出吗？"
   :"After logging out, this device will need the family invite code to join again. Log out?";
 if(!confirm(msg)) return;
 try{
   if(channel){ try{await sb.removeChannel(channel)}catch(_e){} channel=null; }
   const {error}=await sb.auth.signOut();
   if(error) throw error;
   state.user=null;state.household=null;state.member=null;state.dishes=[];state.items=[];state.settings=null;
   location.replace(location.origin + location.pathname);
 }catch(e){
   alert((state.lang==="zh"?"退出失败：":"Log out failed: ")+e.message);
 }
}

async function bootAfterMembership(){
 await findMembership();await seedDishesIfEmpty();await loadAll();subscribeRealtime();
 document.getElementById("loading").style.display="none";document.getElementById("onboarding").style.display="none";document.getElementById("mainApp").style.display="block";document.getElementById("bottomNav").style.display="block";
}
async function boot(){
 try{await ensureAuth();if(await findMembership())await bootAfterMembership();else{document.getElementById("loading").style.display="none";document.getElementById("onboarding").style.display="block"}}
 catch(e){document.getElementById("loading").textContent="连接失败："+e.message}
}

document.querySelectorAll(".editMeal").forEach(b=>b.onclick=()=>openPicker(b.dataset.meal));
document.getElementById("savePickerBtn").onclick=savePicker;
document.getElementById("logoutBtn").onclick=logout;
document.querySelectorAll(".closeModal").forEach(b=>b.onclick=()=>b.closest(".modal").classList.remove("show"));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("show")}));
document.getElementById("langBtn").onclick=document.getElementById("settingsLangBtn").onclick=()=>{state.lang=state.lang==="zh"?"en":"zh";localStorage.setItem("fm_lang",state.lang);renderAll()};
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.target).classList.add("active")});
document.getElementById("addDishFab").onclick=()=>{document.getElementById("addDishHeading").textContent=t("addDish");document.getElementById("dishNameLabel").textContent=t("dishName");document.getElementById("dishCategoryLabel").textContent=t("category");document.getElementById("dishPhotoLabel").textContent=t("photo");document.getElementById("dishNoteLabel").textContent=t("note");document.getElementById("quickLabel").textContent=t("quick");document.getElementById("saveDishBtn").textContent=t("save");const sel=document.getElementById("newDishCategory");sel.innerHTML="";["breakfast","meat","veg","soup","staple"].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=t(c);sel.appendChild(o)});document.getElementById("addDishModal").classList.add("show")};
document.getElementById("saveDishBtn").onclick=uploadDish;
document.getElementById("saveDishEditBtn").onclick=saveDishEdit;
document.getElementById("hideDishBtn").onclick=toggleDishActive;

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=5",{updateViaCache:"none"}).catch(()=>{}));

if ("serviceWorker" in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });
}

boot();
</script>
